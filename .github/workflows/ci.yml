name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the whitespace check diffs against the base branch.
          fetch-depth: 0

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Recurse -File -Filter '*.ps1' | ForEach-Object {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName, [ref]$tokens, [ref]$errors)
              if ($errors.Count -gt 0) {
                  foreach ($e in $errors) { Write-Error "$($_.FullName): $($e.Message)" }
                  throw "PowerShell syntax errors in $($_.FullName)"
              }
          }
          Write-Host 'PowerShell syntax OK'

      - name: Check Windhawk metadata blocks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Windhawk silently ignores these blocks when they use // lines instead of /* */.
          $mod = Get-Content -Raw -LiteralPath 'mod/everything-search-explorer.wh.cpp'
          foreach ($block in 'WindhawkModReadme', 'WindhawkModSettings') {
              $m = [regex]::Match($mod, "(?s)//\s*==$block==\s*(.*?)//\s*==/$block==")
              if (-not $m.Success) { throw "Missing $block block in the mod source" }
              $body = $m.Groups[1].Value
              if ($body -notmatch '/\*' -or $body -notmatch '\*/') {
                  throw "$block must contain a /* ... */ block"
              }
              $stripped = [regex]::Replace($body, '(?s)/\*.*?\*/', '')
              if ($stripped -match '(?m)^\s*//') {
                  throw "$block contains // lines outside the block comment"
              }
          }
          Write-Host 'Windhawk metadata blocks OK'

      - name: Check CLSID consistency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The results-folder CLSID is hard-coded in several files; a typo breaks navigation silently.
          $guid = '{7B39C2A2-3E1F-4E4C-9E58-2D9A7B1C4F60}'
          # nse/folder.h is covered by the struct check below.
          $files = @(
              'install-nse.ps1'
              'uninstall-nse.ps1'
              'tools/open-results.ps1'
              'mod/everything-search-explorer.wh.cpp'
              'tests/navigate_probe.cpp'
          )
          foreach ($file in $files) {
              $text = Get-Content -Raw -LiteralPath $file
              if ($text -notmatch [regex]::Escape($guid)) {
                  throw "$file does not reference $guid"
              }
          }
          $structExpected = '0x7b39c2a2,0x3e1f,0x4e4c,{0x9e,0x58,0x2d,0x9a,0x7b,0x1c,0x4f,0x60}'
          foreach ($file in 'mod/everything-search-explorer.wh.cpp', 'nse/folder.h') {
              $normalized = (Get-Content -Raw -LiteralPath $file) -replace '\s+', ''
              if ($normalized -notmatch [regex]::Escape($structExpected)) {
                  throw "$file does not contain the expected CLSID struct"
              }
          }
          Write-Host "CLSID OK: $guid"

      - name: Scan for sensitive patterns
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # Generic patterns so the public workflow does not reveal personal data.
          $pattern = 'C:\\Users\\[^<\\]|@gmail\.com|AKIA|ghp_|github_pat_|-----BEGIN (RSA|OPENSSH|PRIVATE)'
          # Exclude this workflow: it contains the pattern itself and would always match.
          $hits = git grep -n -I -i -E $pattern -- ':!mod/generated/**' ':!.github/workflows/ci.yml'
          if ($LASTEXITCODE -eq 0) {
              $hits
              throw 'Sensitive pattern found'
          }
          Write-Host 'No sensitive patterns found'

      - name: Check repository hygiene
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $forbidden = @('mod/generated', 'dist', 'build', 'build_check')
          $tracked = git ls-files -- $forbidden
          if ($tracked) {
              $tracked
              throw 'Generated headers or build output must not be tracked'
          }
          Write-Host 'No generated or build output tracked'

          $markers = git grep -n -I -E '^(<<<<<<<|>>>>>>>) ' -- .
          if ($LASTEXITCODE -eq 0) {
              $markers
              throw 'Merge conflict markers found'
          }
          if ($LASTEXITCODE -gt 1) { throw 'git grep failed while scanning for conflict markers' }
          Write-Host 'No conflict markers'

          $base = $env:GITHUB_BASE_REF
          $range = 'HEAD~1..HEAD'
          if ($base) {
              git rev-parse --verify -q "origin/$base" | Out-Null
              if ($LASTEXITCODE -eq 0) {
                  $range = "origin/$base...HEAD"
              } else {
                  Write-Host "origin/$base not available; checking HEAD~1 only"
              }
          }
          $diffCheck = git diff --check $range
          if ($LASTEXITCODE -ne 0) {
              $diffCheck
              throw "Whitespace errors in $range"
          }
          Write-Host "Whitespace OK ($range)"

      - name: Build NSE
        shell: pwsh
        run: ./build-nse.ps1

      - name: Verify artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Get-Item 'dist/bin/EverythingSearchNse.dll'
          if (-not $dll -or $dll.Length -eq 0) {
              throw 'NSE DLL is missing or empty'
          }
          $text = [System.Text.Encoding]::Unicode.GetString(
              [System.IO.File]::ReadAllBytes($dll.FullName))
          if (-not $text.Contains('EverythingSearchExplorer')) {
              throw 'NSE DLL has the wrong data directory name'
          }
          Write-Host "NSE OK: $($dll.Length) bytes"

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC toolset not found, cannot inspect exports' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $dumpbin = cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 >nul && dumpbin /nologo /exports dist\bin\EverythingSearchNse.dll"
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed (exit code $LASTEXITCODE)" }
          $exportText = $dumpbin -join "`n"
          foreach ($name in 'DllGetClassObject', 'DllCanUnloadNow', 'EsNseVersion') {
              if ($exportText -notmatch "\b$name\b") { throw "Missing DLL export: $name" }
          }
          Write-Host 'Exports OK: DllGetClassObject, DllCanUnloadNow, EsNseVersion'

      - name: Package NSE
        shell: pwsh
        run: ./package-nse.ps1

      - name: Upload NSE artifact
        uses: actions/upload-artifact@v4
        with:
          name: EverythingSearchNse
          path: |
            dist/EverythingSearchNse-v*.dll
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Ensure the build did not modify tracked files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirty = git status --porcelain
          if ($dirty) {
              $dirty
              throw 'The build or packaging modified tracked files'
          }
          Write-Host 'Working tree clean'
